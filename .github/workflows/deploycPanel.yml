name: Auto Build & Deploy (pnpm)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro
        env:
          NODE_ENV: production
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: pnpm run build

      - name: Deploy to cPanel via SFTP (lftp)
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
      
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" sftp://waterwises.com:2323 <<EOF
          set sftp:auto-confirm yes
          mirror -R --delete --verbose dist/ /home/wwses/public_html/
          quit
          EOF
