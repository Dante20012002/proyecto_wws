name: 🚀 Deploy to cPanel

on:
  # Trigger manual desde GitHub Actions UI
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Forzar rebuild completo'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  
  # Trigger automático en push a main
  push:
    branches:
      - main
  
  # Trigger en pull requests (solo para testing, no deploya)
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build Astro & Deploy to cPanel
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Build Astro
        run: pnpm build
        env:
          # Firebase credentials (ya están en el código, pero por si acaso)
          NODE_ENV: production

      - name: 📊 Build info
        run: |
          echo "📦 Build completado"
          echo "📁 Tamaño del dist:"
          du -sh dist/
          echo "📄 Archivos generados:"
          find dist -type f | wc -l

      - name: 🚀 Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/Thumbs.db
          dangerous-clean-slate: false
          dry-run: false

      - name: ✅ Deploy completado
        run: |
          echo "✅ Sitio desplegado exitosamente a cPanel"
          echo "🌐 URL: https://waterwises.com"

