name: ⏰ Scheduled Build

# Build programado cada 6 horas para mantener el sitio actualizado
# Útil si no tienes webhooks configurados

on:
  schedule:
    # Cada 6 horas (ajusta según necesites)
    - cron: '0 */6 * * *'
  
  workflow_dispatch: # También se puede ejecutar manualmente

jobs:
  build-and-deploy:
    name: Scheduled Build & Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Build Astro
        run: pnpm build

      - name: 🚀 Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: false

      - name: ✅ Deploy completado
        run: echo "✅ Build programado completado"

