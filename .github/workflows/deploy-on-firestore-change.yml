name: 🔥 Deploy on Firestore Change

# Este workflow se ejecuta cuando Firestore detecta cambios
# Requiere configurar un webhook de Firebase Functions

on:
  repository_dispatch:
    types: [firestore-updated]

jobs:
  build-and-deploy:
    name: Auto Deploy from Firestore
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Build Astro
        run: pnpm build

      - name: 🚀 Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: false

      - name: ✅ Deploy completado
        run: |
          echo "✅ Sitio actualizado automáticamente desde Firestore"

